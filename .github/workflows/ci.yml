name: CI

# Build + full SmokeTests on a standard (free for public repos) macOS runner.
# Not on every branch push — only when it matters:
#   - pull requests into main
#   - v* tag pushes (pre-release check; does not publish)
#   - manual workflow_dispatch
# Releasing a DMG / GitHub Release / Homebrew tap is a separate workflow:
# Actions → Release → Run workflow. That path also re-runs SmokeTests via bin/release.
# Do not use larger/paid runner labels (macos-*-large, *-xlarge, etc.).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "portal/**"
      - "plans/**"
      - "prd/**"
      - "README.md"
      - "LICENSE"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and smoke tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macos-26 currently ships Xcode 26.x (default 26.6). Prefer the newest
      # installed copy so this keeps working when a newer 26.x (or 27, once it
      # lands on this image) is added. The preview `xcode-27` image is not used:
      # it is still marked preview and is unnecessary for these tests.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift build
        run: swift build

      - name: Smoke tests
        run: swift run SmokeTests
